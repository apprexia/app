<h5 class="info-title" [class]="class()">

    @if (label()) {
        <span>{{ label() }}</span>
    }

    <span
        class="info-wrapper"
        (click)="toggleTooltip($event)"
    >
        <i class="bi bi-info-circle info-icon"></i>

        <span
            class="info-tooltip"
            [class.visible]="isVisible()"
        >
            {{ text() }}

            @if (formula()) {
                <strong>{{ formula() }}</strong>
            }
        </span>
    </span>

</h5>
